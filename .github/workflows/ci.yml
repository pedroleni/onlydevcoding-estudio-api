name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7.1.2
        with:
          version: "0.13.8"
      - name: Instalar zsh
        # El vídeo final se lanza con /bin/zsh -f, como en el Mac del estudio.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Sincronizar entorno
        run: uv sync --frozen
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Tests
        run: uv run --frozen pytest -q

  clean-code:
    # Puerta automática de clean code (docs/clean-code.md): complejidad, duplicados y código muerto.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7.1.2
        with:
          version: "0.13.8"
      - name: Sincronizar entorno
        run: uv sync --frozen
      - name: Clean code
        run: uv run --frozen bash scripts/clean_code.sh
