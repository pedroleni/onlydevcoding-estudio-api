[project]
name = "estudio-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.163.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pylint==4.1.3",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "vulture==2.16",
]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    'ignore:Using `httpx` with `starlette\.testclient` is deprecated; install `httpx2` instead\.:starlette.exceptions.StarletteDeprecationWarning',
]

# Normas de clean code (docs/clean-code.md). Las reglas de complejidad que el código
# anterior ya incumplía llevan `# noqa` con su código: es deuda congelada que la
# revisión periódica va quitando; un `noqa` nuevo necesita justificarse en la PR.
[tool.ruff.lint]
extend-select = [
    "C90",     # complejidad ciclomática (mccabe)
    "PLR0911", # demasiados return
    "PLR0912", # demasiadas ramas
    "PLR0913", # demasiados parámetros
    "PLR0915", # demasiadas sentencias
    "SIM",     # simplificaciones
    "RET",     # returns innecesarios o incoherentes
    "PIE",     # código redundante
    "ARG",     # argumentos sin usar
    "C4",      # comprensiones innecesarias
    "B",       # trampas habituales (bugbear)
    "UP",      # sintaxis moderna de Python 3.14
    "PERF",    # rendimiento evidente
    "ERA",     # código comentado
    "RUF100",  # noqa que ya no hace falta
    "PGH004",  # noqa sin código de regla
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.per-file-ignores]
# Los tests reciben fixtures que no siempre usan.
"tests/**" = ["ARG", "PLR0913", "PLR0915"]
